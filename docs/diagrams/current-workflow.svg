<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390" role="img" aria-labelledby="title desc">
  <title id="title">在线聊天与影响分析的共同流程</title>
  <desc id="desc">绑定快照后进入 Main。Main 按需派 Domain 或 Code 调查，接收发现并重新判断，最后校验回复或报告。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 10 5 0 10 2 5Z" fill="#526A82"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; text-anchor: middle; fill: #152C41; }
    .label { font-size: 23px; font-weight: 700; }
    .detail { font-size: 16px; fill: #37536C; }
    .terminal .label { fill: #FFFFFF; }
    .terminal .detail { fill: #D5E7F6; }
  </style>
  <rect x="1" y="1" width="558" height="388" rx="19" fill="#F8FAFD" stroke="#CFDCEA" stroke-width="2"/>

  <g fill="none" stroke="#526A82" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M169 86V133"/>
    <path d="M307 153H369"/>
    <path d="M454 213V242H321Q307 242 307 228V193"/>
    <path d="M169 213V295"/>
  </g>
  <text class="detail" x="338" y="143">派单</text>
  <text class="detail" x="394" y="265">发现与证据</text>
  <text class="detail" x="111" y="258">校验输出</text>

  <g class="terminal">
    <rect x="31" y="22" width="276" height="64" rx="13" fill="#16344D"/>
    <text class="label" x="169" y="50">绑定资料快照</text>
    <text class="detail" x="169" y="72">聊天请求或影响分析</text>
  </g>
  <g>
    <rect x="31" y="133" width="276" height="80" rx="13" fill="#EAF2FF" stroke="#6393CB" stroke-width="1.5"/>
    <text class="label" x="169" y="166">Main · 规划和综合</text>
    <text class="detail" x="169" y="191">根据问题和证据决定下一步</text>
  </g>
  <g>
    <rect x="369" y="133" width="168" height="80" rx="13" fill="#E6F5F0" stroke="#43967E" stroke-width="1.5"/>
    <text class="label" x="453" y="166">Domain 或 Code</text>
    <text class="detail" x="453" y="191">按问题调查</text>
  </g>
  <g class="terminal">
    <rect x="31" y="295" width="276" height="64" rx="13" fill="#16344D"/>
    <text class="label" x="169" y="323">交付结果</text>
    <text class="detail" x="169" y="345">回复或结构化影响报告</text>
  </g>
</svg>
